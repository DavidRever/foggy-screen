<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidrio empañado</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .stage {
    position: fixed;
    inset: 0;
    background: #000;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #ui { pointer-events: none; }
  video { display: none; }

  /* ---------- Pantalla inicial ---------- */
  .start {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #0a0a0a;
    color: #f2f2f2;
    cursor: pointer;
    transition: opacity 0.8s ease;
  }
  .start.hide { opacity: 0; pointer-events: none; }
  .start h1 {
    font-weight: 200;
    font-size: clamp(22px, 4vw, 38px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    padding-left: 0.35em;
  }
  .start p {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.45;
    text-align: center;
    padding: 0 24px;
  }
  .start p.error { opacity: 0.9; color: #ff8a8a; letter-spacing: 0.05em; text-transform: none; }

  /* ---------- Pista temporal ---------- */
  .hint {
    position: absolute;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%);
    z-index: 10;
    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
  }
  .hint.show { opacity: 1; }

  /* ---------- Controles ---------- */
  .control {
    position: absolute;
    bottom: 22px;
    z-index: 30;
    display: flex;
    align-items: center;
    height: 44px;
    border-radius: 22px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: rgba(0, 0, 0, 0.28);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease, border-color 0.2s, background 0.2s;
  }
  .control.ready { opacity: 1; pointer-events: auto; }
  .control:hover { border-color: rgba(255, 255, 255, 0.8); background: rgba(0, 0, 0, 0.45); }

  .intensity { left: 22px; padding: 0 16px; gap: 12px; }
  .intensity svg { width: 18px; height: 18px; flex: none; stroke: #fff; opacity: 0.85; }

  .shot { right: 22px; width: 44px; justify-content: center; cursor: pointer; }
  .shot svg { width: 19px; height: 19px; stroke: #fff; }

  /* Slider minimalista */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 18px;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 1px;
    background: rgba(255, 255, 255, 0.6);
  }
  input[type="range"]::-moz-range-track {
    height: 1px;
    background: rgba(255, 255, 255, 0.6);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    margin-top: -7px;
    border-radius: 50%;
    background: #fff;
    border: none;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: none;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
  }

  /* Destello al tomar captura */
  .flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    z-index: 40;
    pointer-events: none;
  }
  .flash.go { animation: flash 0.35s ease-out; }
  @keyframes flash { 0% { opacity: 0.7; } 100% { opacity: 0; } }
</style>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>

<body>

  <div class="stage" id="stage">
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Cámara + vaho (esto es lo que se captura) -->
    <canvas id="view" width="1280" height="720"></canvas>
    <!-- Cursor del dedo (no sale en la captura) -->
    <canvas id="ui" width="1280" height="720"></canvas>

    <div class="hint" id="hint">Sopla para empañar · dibuja con el dedo índice</div>

    <!-- Botón 1: intensidad del vaho -->
    <div class="control intensity" id="intensityBox" title="Intensidad del vaho">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8c3-2.5 5 2.5 9 0s6-2.5 9 0"></path>
        <path d="M3 13c3-2.5 5 2.5 9 0s6-2.5 9 0"></path>
        <path d="M3 18c3-2.5 5 2.5 9 0s6-2.5 9 0"></path>
      </svg>
      <input type="range" id="intensity" min="0.2" max="1" step="0.01" value="0.8" aria-label="Intensidad del vaho">
    </div>

    <!-- Botón 2: captura -->
    <button class="control shot" id="shotBtn" aria-label="Tomar captura" title="Tomar captura">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path>
        <circle cx="12" cy="12.5" r="3.4"></circle>
      </svg>
    </button>

    <div class="flash" id="flash"></div>

    <div class="start" id="start">
      <h1>Vidrio empañado</h1>
      <p id="startMsg">Toca para empezar · permite cámara y micrófono</p>
    </div>
  </div>

<script>
(() => {

  // ============================================================
  // AJUSTES (puedes tocarlos si algo no responde bien)
  // ============================================================
  const W = 1280, H = 720;

  const BLOW_MARGIN_DB   = 9;     // cuántos dB sobre el ruido ambiente se considera soplido
  const BLOW_FLATNESS    = 0.10;  // "ruido plano" (soplido) vs voz con tonos
  const BLOW_STRONG_DB   = 24;    // por encima de esto se acepta como soplido siempre
  const BRUSH_CORE       = 30;    // grosor del trazo transparente (px)
  const BRUSH_SOFT       = 54;    // halo suave alrededor del trazo
  const YAW_GAIN         = 2.2;   // cuánto se desplaza el vaho al girar la cabeza (horizontal)
  const PITCH_GAIN       = 3.0;   // idem vertical
  const NOSE_NEUTRAL     = 0.58;  // posición vertical relativa de la nariz con la cabeza recta

  // ============================================================
  // ELEMENTOS
  // ============================================================
  const video = document.getElementById("webcam");
  const view = document.getElementById("view");
  const ui = document.getElementById("ui");
  const ctx = view.getContext("2d");
  const uictx = ui.getContext("2d");
  const startEl = document.getElementById("start");
  const startMsg = document.getElementById("startMsg");
  const hintEl = document.getElementById("hint");
  const slider = document.getElementById("intensity");
  const intensityBox = document.getElementById("intensityBox");
  const shotBtn = document.getElementById("shotBtn");
  const flashEl = document.getElementById("flash");

  // ============================================================
  // CAPAS OFFSCREEN
  // ============================================================
  // Máscara del vaho: alpha = cuánto vaho hay en cada punto
  const mask = document.createElement("canvas");
  mask.width = W; mask.height = H;
  const maskCtx = mask.getContext("2d");

  // Capa de vaho ya compuesta (cámara borrosa + tinte + textura)
  const fog = document.createElement("canvas");
  fog.width = W; fog.height = H;
  const fogCtx = fog.getContext("2d");

  // Versión pequeña de la cámara para desenfocar barato
  const supportsFilter = "filter" in CanvasRenderingContext2D.prototype;
  const small = document.createElement("canvas");
  small.width = supportsFilter ? 320 : 128;
  small.height = supportsFilter ? 180 : 72;
  const smallCtx = small.getContext("2d");

  // Textura sutil de gotitas
  const noise = document.createElement("canvas");
  noise.width = 256; noise.height = 256;
  (() => {
    const nctx = noise.getContext("2d");
    const img = nctx.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) {
      const r = Math.random();
      img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
      img.data[i + 3] = r < 0.18 ? Math.random() * 46 : 0;
    }
    nctx.putImageData(img, 0, 0);
  })();
  const noisePattern = fogCtx.createPattern(noise, "repeat");

  // ============================================================
  // GEOMETRÍA DE LA CÁMARA (recorte tipo "cover" + espejo)
  // ============================================================
  let drawW = W, drawH = H, offX = 0, offY = 0;

  function updateVideoGeometry() {
    const vw = video.videoWidth || W;
    const vh = video.videoHeight || H;
    const scale = Math.max(W / vw, H / vh);
    drawW = vw * scale;
    drawH = vh * scale;
    offX = (W - drawW) / 2;
    offY = (H - drawH) / 2;
  }

  // Coordenadas normalizadas de MediaPipe → pantalla (ya en modo espejo)
  function mapX(nx) { return W - (offX + nx * drawW); }
  function mapY(ny) { return offY + ny * drawH; }

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  // ============================================================
  // SOPLIDO: detección con el micrófono
  // ============================================================
  let audioCtx = null, analyser = null, freqData = null;
  let baselineDb = null, baselineFrames = 0;
  let blowStrength = 0;

  async function setupAudio(stream) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    if (audioCtx.state === "suspended") await audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.45;
    src.connect(analyser);
    freqData = new Float32Array(analyser.frequencyBinCount);
  }

  function readBlow() {
    if (!analyser) return 0;

    analyser.getFloatFrequencyData(freqData);

    const binHz = audioCtx.sampleRate / analyser.fftSize;
    const lo = Math.max(1, Math.ceil(80 / binHz));
    const hi = Math.min(freqData.length - 1, Math.floor(4000 / binHz));

    let sumP = 0, sumLog = 0, n = 0;
    for (let i = lo; i <= hi; i++) {
      const p = Math.pow(10, freqData[i] / 10) + 1e-20;
      sumP += p;
      sumLog += Math.log(p);
      n++;
    }
    const meanP = sumP / n;
    const levelDb = 10 * Math.log10(meanP);
    const flatness = Math.exp(sumLog / n) / meanP; // 1 = ruido plano, ~0 = tono/voz

    if (baselineDb === null) baselineDb = levelDb;

    const excess = levelDb - baselineDb;
    const isBlow =
      (excess > BLOW_MARGIN_DB && flatness > BLOW_FLATNESS) ||
      excess > BLOW_STRONG_DB;

    // El ruido ambiente solo se aprende cuando no se sopla
    if (!isBlow) {
      const rate = baselineFrames < 60 ? 0.2 : 0.01;
      baselineDb += (levelDb - baselineDb) * rate;
      baselineFrames++;
    }

    const target = isBlow ? clamp((excess - BLOW_MARGIN_DB) / 18 + 0.25, 0, 1) : 0;
    // ataque rápido, caída lenta
    blowStrength += (target - blowStrength) * (target > blowStrength ? 0.35 : 0.08);
    return blowStrength;
  }

  // ============================================================
  // DIRECCIÓN DE LA BOCA (FaceMesh)
  // ============================================================
  const face = { t: 0, mouth: { x: W / 2, y: H * 0.6 }, target: { x: W / 2, y: H * 0.55 } };

  function onFaceResults(results) {
    const lm = results.multiFaceLandmarks && results.multiFaceLandmarks[0];
    if (!lm) return;

    const P = i => ({ x: mapX(lm[i].x), y: mapY(lm[i].y) });

    const upperLip = P(13), lowerLip = P(14);
    const mouth = { x: (upperLip.x + lowerLip.x) / 2, y: (upperLip.y + lowerLip.y) / 2 };

    const nose = P(1);
    const cheekA = P(234), cheekB = P(454);
    const top = P(10), chin = P(152);

    const faceW = Math.max(1, Math.abs(cheekA.x - cheekB.x));
    const faceH = Math.max(1, chin.y - top.y);

    // Giro horizontal: la nariz respecto al centro de las mejillas
    const yaw = (nose.x - (cheekA.x + cheekB.x) / 2) / faceW;
    // Inclinación vertical: la nariz respecto a su posición neutra
    const pitch = (nose.y - top.y) / faceH - NOSE_NEUTRAL;

    const tx = clamp(mouth.x + yaw * W * YAW_GAIN, 0, W);
    const ty = clamp(mouth.y + pitch * H * PITCH_GAIN, 0, H);

    const k = face.t ? 0.25 : 1;
    face.mouth.x += (mouth.x - face.mouth.x) * k;
    face.mouth.y += (mouth.y - face.mouth.y) * k;
    face.target.x += (tx - face.target.x) * k;
    face.target.y += (ty - face.target.y) * k;
    face.t = performance.now();
  }

  // ============================================================
  // VAHO: depositar y evaporar
  // ============================================================
  function deposit(x, y, r, a) {
    const g = maskCtx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,255,255,${a})`);
    g.addColorStop(0.55, `rgba(255,255,255,${a * 0.55})`);
    g.addColorStop(1, "rgba(255,255,255,0)");
    maskCtx.fillStyle = g;
    maskCtx.beginPath();
    maskCtx.arc(x, y, r, 0, Math.PI * 2);
    maskCtx.fill();
  }

  function applyBlow(strength) {
    if (strength < 0.06) return;

    const fresh = performance.now() - face.t < 700;
    const src = fresh ? face.mouth : { x: W / 2, y: H * 0.65 };
    const tgt = fresh ? face.target : { x: W / 2, y: H * 0.5 };
    const power = 0.4 + parseFloat(slider.value);
    const a = 0.07 * strength * power;

    // Varias manchas a lo largo del "chorro" de aire, más grandes al alejarse
    const steps = [0.35, 0.7, 1.0];
    steps.forEach((t, i) => {
      const jx = (Math.random() - 0.5) * 40;
      const jy = (Math.random() - 0.5) * 40;
      const x = src.x + (tgt.x - src.x) * t + jx;
      const y = src.y + (tgt.y - src.y) * t + jy;
      const r = (70 + i * 55) * (0.7 + strength * 0.6);
      deposit(x, y, r, a);
    });
  }

  let frameCount = 0;
  function evaporate() {
    // Muy lento: el vidrio se va aclarando solo con los segundos
    if (frameCount % 30 !== 0) return;
    maskCtx.save();
    maskCtx.globalCompositeOperation = "destination-out";
    maskCtx.fillStyle = "rgba(0,0,0,0.012)";
    maskCtx.fillRect(0, 0, W, H);
    maskCtx.restore();
  }

  // ============================================================
  // DEDOS: dibujar = quitar el vaho (trazo transparente)
  // ============================================================
  const EXTEND_ANGLE = 150;

  function fingerAngle(lm, mcp, pip, tip) {
    const a = { x: lm[mcp].x - lm[pip].x, y: lm[mcp].y - lm[pip].y, z: (lm[mcp].z || 0) - (lm[pip].z || 0) };
    const b = { x: lm[tip].x - lm[pip].x, y: lm[tip].y - lm[pip].y, z: (lm[tip].z || 0) - (lm[pip].z || 0) };
    const dot = a.x * b.x + a.y * b.y + a.z * b.z;
    const ma = Math.hypot(a.x, a.y, a.z) || 1e-6;
    const mb = Math.hypot(b.x, b.y, b.z) || 1e-6;
    return (Math.acos(clamp(dot / (ma * mb), -1, 1)) * 180) / Math.PI;
  }

  const fingerUp = (lm, m, p, t) => fingerAngle(lm, m, p, t) > EXTEND_ANGLE;

  function isIndexPointing(lm) {
    return fingerUp(lm, 5, 6, 8) &&
           !fingerUp(lm, 9, 10, 12) &&
           !fingerUp(lm, 13, 14, 16) &&
           !fingerUp(lm, 17, 18, 20);
  }

  const handStates = {};
  function getState(key) {
    return handStates[key] || (handStates[key] = { last: null, smooth: null });
  }
  function resetState(key) {
    if (handStates[key]) { handStates[key].last = null; handStates[key].smooth = null; }
  }

  function wipeSegment(from, to) {
    maskCtx.save();
    maskCtx.globalCompositeOperation = "destination-out";
    maskCtx.lineCap = "round";
    maskCtx.lineJoin = "round";

    // Halo suave
    maskCtx.strokeStyle = "rgba(0,0,0,0.35)";
    maskCtx.lineWidth = BRUSH_SOFT;
    maskCtx.beginPath();
    maskCtx.moveTo(from.x, from.y);
    maskCtx.lineTo(to.x, to.y);
    maskCtx.stroke();

    // Núcleo completamente transparente
    maskCtx.strokeStyle = "rgba(0,0,0,1)";
    maskCtx.lineWidth = BRUSH_CORE;
    maskCtx.beginPath();
    maskCtx.moveTo(from.x, from.y);
    maskCtx.lineTo(to.x, to.y);
    maskCtx.stroke();
    maskCtx.restore();
  }

  let cursors = [];

  function onHandsResults(results) {
    const hands = results.multiHandLandmarks;
    const handedness = results.multiHandedness || [];
    cursors = [];

    if (!hands || hands.length === 0) {
      Object.keys(handStates).forEach(resetState);
      return;
    }

    const present = new Set();

    hands.forEach((hand, i) => {
      const key = handedness[i]?.label || `hand_${i}`;
      present.add(key);

      if (!isIndexPointing(hand)) { resetState(key); return; }

      const state = getState(key);
      const raw = { x: mapX(hand[8].x), y: mapY(hand[8].y) };

      if (!state.smooth) {
        state.smooth = { x: raw.x, y: raw.y };
      } else {
        state.smooth.x += (raw.x - state.smooth.x) * 0.4;
        state.smooth.y += (raw.y - state.smooth.y) * 0.4;
      }
      const p = { x: state.smooth.x, y: state.smooth.y };

      wipeSegment(state.last || p, p);
      state.last = p;
      cursors.push(p);
    });

    Object.keys(handStates).forEach(k => { if (!present.has(k)) resetState(k); });
  }

  // ============================================================
  // RENDER
  // ============================================================
  function render() {
    frameCount++;
    updateVideoGeometry();

    const strength = readBlow();
    applyBlow(strength);
    evaporate();

    // 1) Cámara en modo espejo
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, offX, offY, drawW, drawH);
    ctx.restore();

    // 2) Cámara desenfocada (lo que se "ve a través del vaho")
    smallCtx.save();
    smallCtx.translate(small.width, 0);
    smallCtx.scale(-1, 1);
    if (supportsFilter) smallCtx.filter = "blur(3px)";
    const sx = small.width / W, sy = small.height / H;
    smallCtx.drawImage(video, offX * sx, offY * sy, drawW * sx, drawH * sy);
    smallCtx.restore();

    fogCtx.globalCompositeOperation = "source-over";
    fogCtx.globalAlpha = 1;
    fogCtx.imageSmoothingEnabled = true;
    fogCtx.imageSmoothingQuality = "high";
    fogCtx.drawImage(small, 0, 0, W, H);

    // 3) Tinte blanco-azulado + gotitas
    fogCtx.fillStyle = "rgba(228, 236, 243, 0.42)";
    fogCtx.fillRect(0, 0, W, H);
    fogCtx.globalAlpha = 0.6;
    fogCtx.fillStyle = noisePattern;
    fogCtx.fillRect(0, 0, W, H);
    fogCtx.globalAlpha = 1;

    // 4) Recortar el vaho con la máscara (donde dibujaste queda transparente)
    fogCtx.globalCompositeOperation = "destination-in";
    fogCtx.drawImage(mask, 0, 0);
    fogCtx.globalCompositeOperation = "source-over";

    // 5) Vaho sobre la cámara, según la intensidad elegida
    ctx.globalAlpha = parseFloat(slider.value);
    ctx.drawImage(fog, 0, 0);
    ctx.globalAlpha = 1;

    // Cursor del dedo (en otra capa: no aparece en la captura)
    uictx.clearRect(0, 0, W, H);
    cursors.forEach(c => {
      uictx.beginPath();
      uictx.arc(c.x, c.y, BRUSH_CORE / 2, 0, Math.PI * 2);
      uictx.strokeStyle = "rgba(255,255,255,0.55)";
      uictx.lineWidth = 1.5;
      uictx.stroke();
    });

    requestAnimationFrame(render);
  }

  // ============================================================
  // MEDIAPIPE
  // ============================================================
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.65,
    minTrackingConfidence: 0.65
  });
  hands.onResults(onHandsResults);

  const faceMesh = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
  });
  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  faceMesh.onResults(onFaceResults);

  let detectCount = 0;
  let busy = false;
  async function detectLoop() {
    if (!busy && video.readyState >= 2) {
      busy = true;
      try {
        await hands.send({ image: video });
        if (detectCount++ % 2 === 0) await faceMesh.send({ image: video });
      } catch (e) { /* se ignora un frame fallido */ }
      busy = false;
    }
    requestAnimationFrame(detectLoop);
  }

  // ============================================================
  // INICIO (cámara + micrófono)
  // ============================================================
  let started = false;

  async function start() {
    if (started) return;
    started = true;
    startMsg.classList.remove("error");
    startMsg.textContent = "Iniciando…";

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        // Sin filtros: si no, el navegador "limpia" el soplido como si fuera ruido
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });

      video.srcObject = stream;
      await video.play();
      await setupAudio(stream);

      render();
      detectLoop();

      startEl.classList.add("hide");
      intensityBox.classList.add("ready");
      shotBtn.classList.add("ready");

      hintEl.classList.add("show");
      setTimeout(() => hintEl.classList.remove("show"), 6000);
    } catch (err) {
      started = false;
      startMsg.classList.add("error");
      startMsg.textContent = "No se pudo acceder a la cámara o al micrófono. Revisa los permisos y toca para reintentar.";
    }
  }

  startEl.addEventListener("click", start);

  // ============================================================
  // CAPTURA
  // ============================================================
  shotBtn.addEventListener("click", () => {
    flashEl.classList.remove("go");
    void flashEl.offsetWidth;
    flashEl.classList.add("go");

    view.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
      a.href = url;
      a.download = `vidrio-empanado-${stamp}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, "image/png");
  });

})();
</script>

</body>
</html>
