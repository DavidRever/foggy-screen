<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fogged Glass</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .stage {
    position: fixed;
    inset: 0;
    background: #000;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #ui { pointer-events: none; }
  video { display: none; }

  /* ---------- Start screen ---------- */
  .start {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #f2f2f2;
    cursor: pointer;
    transition: opacity 0.8s ease;
  }
  .start.hide { opacity: 0; pointer-events: none; }
  .start p {
    font-weight: 200;
    font-size: clamp(16px, 2.4vw, 24px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    padding: 0 24px 0 calc(24px + 0.35em);
    text-align: center;
  }
  .start p.error {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: none;
    color: #ff8a8a;
    max-width: 420px;
    line-height: 1.6;
  }

  /* ---------- Temporary hint ---------- */
  .hint {
    position: absolute;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%);
    z-index: 10;
    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
  }
  .hint.show { opacity: 1; }

  /* ---------- Controls ---------- */
  .control {
    position: absolute;
    bottom: 22px;
    z-index: 30;
    display: flex;
    align-items: center;
    height: 44px;
    border-radius: 22px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: rgba(0, 0, 0, 0.28);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease, border-color 0.2s, background 0.2s;
  }
  .control.ready { opacity: 1; pointer-events: auto; }
  .control:hover { border-color: rgba(255, 255, 255, 0.8); background: rgba(0, 0, 0, 0.45); }

  .intensity { left: 22px; padding: 0 16px; gap: 12px; }
  .intensity svg { width: 18px; height: 18px; flex: none; stroke: #fff; opacity: 0.85; }

  .shot { right: 22px; width: 44px; justify-content: center; cursor: pointer; }
  .shot svg { width: 19px; height: 19px; stroke: #fff; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 18px;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 1px;
    background: rgba(255, 255, 255, 0.6);
  }
  input[type="range"]::-moz-range-track {
    height: 1px;
    background: rgba(255, 255, 255, 0.6);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    margin-top: -7px;
    border-radius: 50%;
    background: #fff;
    border: none;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: none;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
  }

  .flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    z-index: 40;
    pointer-events: none;
  }
  .flash.go { animation: flash 0.35s ease-out; }
  @keyframes flash { 0% { opacity: 0.7; } 100% { opacity: 0; } }
</style>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>

<body>

  <div class="stage" id="stage">
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Camera + fog (this is what the screenshot captures) -->
    <canvas id="view" width="1280" height="720"></canvas>
    <!-- Fingertip cursor (not included in screenshots) -->
    <canvas id="ui" width="1280" height="720"></canvas>

    <div class="hint" id="hint">Pucker &amp; blow to fog · pinch to draw</div>

    <!-- Button 1: fog intensity -->
    <div class="control intensity" id="intensityBox" title="Fog intensity">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8c3-2.5 5 2.5 9 0s6-2.5 9 0"></path>
        <path d="M3 13c3-2.5 5 2.5 9 0s6-2.5 9 0"></path>
        <path d="M3 18c3-2.5 5 2.5 9 0s6-2.5 9 0"></path>
      </svg>
      <input type="range" id="intensity" min="0.2" max="1" step="0.01" value="0.8" aria-label="Fog intensity">
    </div>

    <!-- Button 2: screenshot -->
    <button class="control shot" id="shotBtn" aria-label="Take screenshot" title="Take screenshot">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path>
        <circle cx="12" cy="12.5" r="3.4"></circle>
      </svg>
    </button>

    <div class="flash" id="flash"></div>

    <div class="start" id="start">
      <p id="startMsg">Click to start</p>
    </div>
  </div>

<script>
(() => {

  // ============================================================
  // SETTINGS
  // ============================================================
  const W = 1280, H = 720;

  // Blowing = lips puckered (mouth gets narrower than its relaxed width) with a small opening
  const PUCKER_ENTER   = 0.78;  // mouth width / relaxed width below this → puckered
  const PUCKER_EXIT    = 0.86;  // back above this → no longer puckered (avoids flicker)
  const MIN_LIP_GAP    = 0.004; // lips must be slightly open (relative to face height)
  const MAX_LIP_GAP    = 0.10;  // ...but not wide open (talking, yawning)
  const CALIBRATION_FRAMES = 20;

  const PINCH_CLOSE    = 0.28;  // thumb–index distance (relative to hand size) to start drawing
  const PINCH_OPEN     = 0.45;  // distance to stop drawing
  const EXTEND_ANGLE   = 140;   // degrees; above this a finger counts as extended

  const BRUSH_CORE     = 30;    // transparent stroke width (px)
  const BRUSH_SOFT     = 54;    // soft halo around the stroke
  const YAW_GAIN       = 2.2;   // how far the fog shifts when you turn your head sideways
  const PITCH_GAIN     = 3.0;   // same, vertically
  const NOSE_NEUTRAL   = 0.58;  // relative nose height with the head straight

  // ============================================================
  // ELEMENTS
  // ============================================================
  const video = document.getElementById("webcam");
  const view = document.getElementById("view");
  const ui = document.getElementById("ui");
  const ctx = view.getContext("2d");
  const uictx = ui.getContext("2d");
  const startEl = document.getElementById("start");
  const startMsg = document.getElementById("startMsg");
  const hintEl = document.getElementById("hint");
  const slider = document.getElementById("intensity");
  const intensityBox = document.getElementById("intensityBox");
  const shotBtn = document.getElementById("shotBtn");
  const flashEl = document.getElementById("flash");

  // ============================================================
  // OFFSCREEN LAYERS
  // ============================================================
  // Fog mask: alpha = how much fog is at each point
  const mask = document.createElement("canvas");
  mask.width = W; mask.height = H;
  const maskCtx = mask.getContext("2d");

  // Composited fog layer (blurred camera + tint + droplets)
  const fog = document.createElement("canvas");
  fog.width = W; fog.height = H;
  const fogCtx = fog.getContext("2d");

  // Small camera copy, cheap to blur
  const supportsFilter = "filter" in CanvasRenderingContext2D.prototype;
  const small = document.createElement("canvas");
  small.width = supportsFilter ? 320 : 128;
  small.height = supportsFilter ? 180 : 72;
  const smallCtx = small.getContext("2d");

  // Subtle droplet texture
  const noise = document.createElement("canvas");
  noise.width = 256; noise.height = 256;
  (() => {
    const nctx = noise.getContext("2d");
    const img = nctx.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) {
      const r = Math.random();
      img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
      img.data[i + 3] = r < 0.18 ? Math.random() * 46 : 0;
    }
    nctx.putImageData(img, 0, 0);
  })();
  const noisePattern = fogCtx.createPattern(noise, "repeat");

  // ============================================================
  // CAMERA GEOMETRY ("cover" crop + mirror)
  // ============================================================
  let drawW = W, drawH = H, offX = 0, offY = 0;

  function updateVideoGeometry() {
    const vw = video.videoWidth || W;
    const vh = video.videoHeight || H;
    const scale = Math.max(W / vw, H / vh);
    drawW = vw * scale;
    drawH = vh * scale;
    offX = (W - drawW) / 2;
    offY = (H - drawH) / 2;
  }

  // MediaPipe normalized coords → screen px (already mirrored)
  function mapX(nx) { return W - (offX + nx * drawW); }
  function mapY(ny) { return offY + ny * drawH; }

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  // ============================================================
  // FACE: mouth position, head direction and lip pucker (blowing)
  // ============================================================
  const face = {
    t: 0,
    mouth: { x: W / 2, y: H * 0.6 },
    target: { x: W / 2, y: H * 0.55 }
  };

  let relaxedWidth = null;   // personal "relaxed mouth width / face width" baseline
  let calibCount = 0;
  let puckered = false;
  let blowTarget = 0;
  let blowStrength = 0;

  function onFaceResults(results) {
    const lm = results.multiFaceLandmarks && results.multiFaceLandmarks[0];
    if (!lm) { blowTarget = 0; return; }

    const P = i => ({ x: mapX(lm[i].x), y: mapY(lm[i].y) });

    const upperLip = P(13), lowerLip = P(14);
    const cornerL = P(61), cornerR = P(291);
    const mouth = { x: (upperLip.x + lowerLip.x) / 2, y: (upperLip.y + lowerLip.y) / 2 };

    const nose = P(1);
    const cheekA = P(234), cheekB = P(454);
    const top = P(10), chin = P(152);

    const faceW = Math.max(1, Math.abs(cheekA.x - cheekB.x));
    const faceH = Math.max(1, chin.y - top.y);

    // ---- Direction of the airflow (head yaw / pitch) ----
    const yaw = (nose.x - (cheekA.x + cheekB.x) / 2) / faceW;
    const pitch = (nose.y - top.y) / faceH - NOSE_NEUTRAL;

    const tx = clamp(mouth.x + yaw * W * YAW_GAIN, 0, W);
    const ty = clamp(mouth.y + pitch * H * PITCH_GAIN, 0, H);

    const k = face.t ? 0.25 : 1;
    face.mouth.x += (mouth.x - face.mouth.x) * k;
    face.mouth.y += (mouth.y - face.mouth.y) * k;
    face.target.x += (tx - face.target.x) * k;
    face.target.y += (ty - face.target.y) * k;
    face.t = performance.now();

    // ---- Lip pucker detection ----
    const widthRatio = dist(cornerL, cornerR) / faceW;   // how wide the mouth is
    const lipGap = dist(upperLip, lowerLip) / faceH;     // how open the lips are

    if (relaxedWidth === null) relaxedWidth = widthRatio;

    const rel = widthRatio / relaxedWidth;
    const gapOk = lipGap > MIN_LIP_GAP && lipGap < MAX_LIP_GAP;

    if (calibCount >= CALIBRATION_FRAMES) {
      if (!puckered && rel < PUCKER_ENTER && gapOk) puckered = true;
      else if (puckered && (rel > PUCKER_EXIT || !gapOk)) puckered = false;
    }

    // The relaxed width is learned only while not puckered (rises fast, falls slowly)
    if (!puckered) {
      relaxedWidth += (widthRatio - relaxedWidth) * (widthRatio > relaxedWidth ? 0.08 : 0.01);
      calibCount++;
    }

    if (puckered) {
      const depth = 1 - rel;                          // 0.22+ when puckered
      blowTarget = clamp(0.45 + (depth - 0.22) * 3, 0.45, 1);
    } else {
      blowTarget = 0;
    }
  }

  function updateBlow() {
    // No recent face → no blowing
    if (performance.now() - face.t > 300) blowTarget = 0;
    blowStrength += (blowTarget - blowStrength) * (blowTarget > blowStrength ? 0.3 : 0.15);
    if (blowStrength < 0.01) blowStrength = 0;
    return blowStrength;
  }

  // ============================================================
  // FOG: deposit and evaporate
  // ============================================================
  function deposit(x, y, r, a) {
    const g = maskCtx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,255,255,${a})`);
    g.addColorStop(0.55, `rgba(255,255,255,${a * 0.55})`);
    g.addColorStop(1, "rgba(255,255,255,0)");
    maskCtx.fillStyle = g;
    maskCtx.beginPath();
    maskCtx.arc(x, y, r, 0, Math.PI * 2);
    maskCtx.fill();
  }

  function applyBlow(strength) {
    if (strength < 0.06) return;

    const src = face.mouth;
    const tgt = face.target;
    const power = 0.4 + parseFloat(slider.value);
    const a = 0.07 * strength * power;

    // Several puffs along the airflow, larger the farther they go
    [0.35, 0.7, 1.0].forEach((t, i) => {
      const jx = (Math.random() - 0.5) * 40;
      const jy = (Math.random() - 0.5) * 40;
      const x = src.x + (tgt.x - src.x) * t + jx;
      const y = src.y + (tgt.y - src.y) * t + jy;
      const r = (70 + i * 55) * (0.7 + strength * 0.6);
      deposit(x, y, r, a);
    });
  }

  let frameCount = 0;
  function evaporate() {
    // Very slow: the glass clears on its own over time
    if (frameCount % 30 !== 0) return;
    maskCtx.save();
    maskCtx.globalCompositeOperation = "destination-out";
    maskCtx.fillStyle = "rgba(0,0,0,0.012)";
    maskCtx.fillRect(0, 0, W, H);
    maskCtx.restore();
  }

  // ============================================================
  // HANDS: pinch (thumb + index, other fingers up) = wipe the fog
  // ============================================================
  function fingerAngle(lm, mcp, pip, tip) {
    const a = { x: lm[mcp].x - lm[pip].x, y: lm[mcp].y - lm[pip].y, z: (lm[mcp].z || 0) - (lm[pip].z || 0) };
    const b = { x: lm[tip].x - lm[pip].x, y: lm[tip].y - lm[pip].y, z: (lm[tip].z || 0) - (lm[pip].z || 0) };
    const dot = a.x * b.x + a.y * b.y + a.z * b.z;
    const ma = Math.hypot(a.x, a.y, a.z) || 1e-6;
    const mb = Math.hypot(b.x, b.y, b.z) || 1e-6;
    return (Math.acos(clamp(dot / (ma * mb), -1, 1)) * 180) / Math.PI;
  }

  const fingerUp = (lm, m, p, t) => fingerAngle(lm, m, p, t) > EXTEND_ANGLE;

  function otherFingersUp(lm) {
    return fingerUp(lm, 9, 10, 12) &&   // middle
           fingerUp(lm, 13, 14, 16) &&  // ring
           fingerUp(lm, 17, 18, 20);    // pinky
  }

  function pinchRatio(lm) {
    const handSize = dist(lm[0], lm[9]) || 1;
    return dist(lm[4], lm[8]) / handSize;
  }

  const handStates = {};
  function getState(key) {
    return handStates[key] || (handStates[key] = { last: null, smooth: null, pinching: false });
  }
  function resetState(key) {
    if (handStates[key]) {
      handStates[key].last = null;
      handStates[key].smooth = null;
      handStates[key].pinching = false;
    }
  }

  function wipeSegment(from, to) {
    maskCtx.save();
    maskCtx.globalCompositeOperation = "destination-out";
    maskCtx.lineCap = "round";
    maskCtx.lineJoin = "round";

    // Soft halo
    maskCtx.strokeStyle = "rgba(0,0,0,0.35)";
    maskCtx.lineWidth = BRUSH_SOFT;
    maskCtx.beginPath();
    maskCtx.moveTo(from.x, from.y);
    maskCtx.lineTo(to.x, to.y);
    maskCtx.stroke();

    // Fully transparent core
    maskCtx.strokeStyle = "rgba(0,0,0,1)";
    maskCtx.lineWidth = BRUSH_CORE;
    maskCtx.beginPath();
    maskCtx.moveTo(from.x, from.y);
    maskCtx.lineTo(to.x, to.y);
    maskCtx.stroke();
    maskCtx.restore();
  }

  let cursors = [];

  function onHandsResults(results) {
    const hands = results.multiHandLandmarks;
    const handedness = results.multiHandedness || [];
    cursors = [];

    if (!hands || hands.length === 0) {
      Object.keys(handStates).forEach(resetState);
      return;
    }

    const present = new Set();

    hands.forEach((hand, i) => {
      const key = handedness[i]?.label || `hand_${i}`;
      present.add(key);

      if (!otherFingersUp(hand)) { resetState(key); return; }

      const state = getState(key);
      const ratio = pinchRatio(hand);

      if (!state.pinching && ratio < PINCH_CLOSE) state.pinching = true;
      else if (state.pinching && ratio > PINCH_OPEN) state.pinching = false;

      if (!state.pinching) {
        state.last = null;
        state.smooth = null;
        return;
      }

      // Draw at the midpoint between thumb tip and index tip
      const raw = {
        x: (mapX(hand[4].x) + mapX(hand[8].x)) / 2,
        y: (mapY(hand[4].y) + mapY(hand[8].y)) / 2
      };

      if (!state.smooth) {
        state.smooth = { x: raw.x, y: raw.y };
      } else {
        state.smooth.x += (raw.x - state.smooth.x) * 0.4;
        state.smooth.y += (raw.y - state.smooth.y) * 0.4;
      }
      const p = { x: state.smooth.x, y: state.smooth.y };

      wipeSegment(state.last || p, p);
      state.last = p;
      cursors.push(p);
    });

    Object.keys(handStates).forEach(k => { if (!present.has(k)) resetState(k); });
  }

  // ============================================================
  // RENDER
  // ============================================================
  function render() {
    frameCount++;
    updateVideoGeometry();

    applyBlow(updateBlow());
    evaporate();

    // 1) Mirrored camera
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, offX, offY, drawW, drawH);
    ctx.restore();

    // 2) Blurred camera (what you see "through" the fog)
    smallCtx.save();
    smallCtx.translate(small.width, 0);
    smallCtx.scale(-1, 1);
    if (supportsFilter) smallCtx.filter = "blur(3px)";
    const sx = small.width / W, sy = small.height / H;
    smallCtx.drawImage(video, offX * sx, offY * sy, drawW * sx, drawH * sy);
    smallCtx.restore();

    fogCtx.globalCompositeOperation = "source-over";
    fogCtx.globalAlpha = 1;
    fogCtx.imageSmoothingEnabled = true;
    fogCtx.imageSmoothingQuality = "high";
    fogCtx.drawImage(small, 0, 0, W, H);

    // 3) Cool white tint + droplets
    fogCtx.fillStyle = "rgba(228, 236, 243, 0.42)";
    fogCtx.fillRect(0, 0, W, H);
    fogCtx.globalAlpha = 0.6;
    fogCtx.fillStyle = noisePattern;
    fogCtx.fillRect(0, 0, W, H);
    fogCtx.globalAlpha = 1;

    // 4) Cut the fog with the mask (wiped areas become transparent)
    fogCtx.globalCompositeOperation = "destination-in";
    fogCtx.drawImage(mask, 0, 0);
    fogCtx.globalCompositeOperation = "source-over";

    // 5) Fog over the camera, scaled by the chosen intensity
    ctx.globalAlpha = parseFloat(slider.value);
    ctx.drawImage(fog, 0, 0);
    ctx.globalAlpha = 1;

    // Fingertip cursor (separate layer: not in screenshots)
    uictx.clearRect(0, 0, W, H);
    cursors.forEach(c => {
      uictx.beginPath();
      uictx.arc(c.x, c.y, BRUSH_CORE / 2, 0, Math.PI * 2);
      uictx.strokeStyle = "rgba(255,255,255,0.55)";
      uictx.lineWidth = 1.5;
      uictx.stroke();
    });

    requestAnimationFrame(render);
  }

  // ============================================================
  // MEDIAPIPE
  // ============================================================
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.65,
    minTrackingConfidence: 0.65
  });
  hands.onResults(onHandsResults);

  const faceMesh = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
  });
  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  faceMesh.onResults(onFaceResults);

  let busy = false;
  async function detectLoop() {
    if (!busy && video.readyState >= 2) {
      busy = true;
      try {
        await hands.send({ image: video });
        await faceMesh.send({ image: video });
      } catch (e) { /* skip a failed frame */ }
      busy = false;
    }
    requestAnimationFrame(detectLoop);
  }

  // ============================================================
  // START (camera only, no microphone)
  // ============================================================
  let started = false;

  async function start() {
    if (started) return;
    started = true;
    startMsg.classList.remove("error");
    startMsg.textContent = "Starting…";

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      render();
      detectLoop();

      startEl.classList.add("hide");
      intensityBox.classList.add("ready");
      shotBtn.classList.add("ready");

      hintEl.classList.add("show");
      setTimeout(() => hintEl.classList.remove("show"), 6000);
    } catch (err) {
      started = false;
      startMsg.classList.add("error");
      startMsg.textContent = "Could not access the camera. Check your permissions and click to try again.";
    }
  }

  startEl.addEventListener("click", start);

  // ============================================================
  // SCREENSHOT
  // ============================================================
  shotBtn.addEventListener("click", () => {
    flashEl.classList.remove("go");
    void flashEl.offsetWidth;
    flashEl.classList.add("go");

    view.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
      a.href = url;
      a.download = `fogged-glass-${stamp}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, "image/png");
  });

})();
</script>

</body>
</html>
